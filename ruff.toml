# Lint only (no formatting) — keeps existing code style untouched.
include = ["backend/**/*.py", "storage/**/*.py"]
target-version = "py313"

[lint]
# Defaults: pyflakes (F) + pycodestyle errors (E4/E7/E9).
# B = bugbear (likely bugs), ASYNC = async pitfalls — useful for asyncpg/FastAPI code.
extend-select = ["B", "ASYNC"]

[lint.flake8-bugbear]
# FastAPI DI idiom: Depends()/Query()/... in argument defaults is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]
