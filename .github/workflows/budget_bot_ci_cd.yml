name: Deploy Budget Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      # iOS-клиент не деплоится этим пайплайном — он собирается локально в Xcode.
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: deploy-budget-bot-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-latest

    # Версия совпадает с продом (infra/docker-compose.yml), иначе проверка
    # схемы доказывала бы работоспособность на другом Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: budget_ci
          POSTGRES_PASSWORD: budget_ci
          POSTGRES_DB: budget_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_ci -d budget_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGPASSWORD: budget_ci
      POSTGRES_USER: budget_ci
      DB_DATABASE: budget_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Совпадает с infra/api.Dockerfile.
          python-version: "3.10"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # tsc -b входит в build, поэтому отдельного typecheck не нужно.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Lint backend
        run: ruff check backend storage

      - name: Validate backend modules
        run: |
          find backend storage -name '*.py' -not -path '*/.cache/*' -print0 \
            | xargs -0 -r python -m py_compile

      - name: Validate shell scripts
        run: |
          find . -name '*.sh' \
            -not -path './venv/*' -not -path './node_modules/*' \
            -not -path './crypto-task/*' -not -path './.git/*' \
            -print0 | xargs -0 -r -n1 bash -n

      # Схема собирается с нуля ровно так же, как на свежей установке.
      # Именно этот шаг ловит расхождение tb/ с миграциями: без него таблица
      # могла месяцами существовать только в миграции, и узнавали об этом
      # при попытке поднять БД заново.
      - name: Build database schema from scratch
        # client_min_messages: иначе лог тонет в NOTICE от каждого
        # CREATE ... IF NOT EXISTS и читать его невозможно.
        env:
          PGOPTIONS: -c client_min_messages=warning
        run: |
          psql -U budget_ci -d budget_ci -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS budgeting'
          bash infra/db/Scripts/run_table_scripts.sh
          bash infra/db/Scripts/run_migrations.sh

      - name: Run SQL tests
        run: |
          for test_file in infra/db/Scripts/budgeting/tests/*.sql; do
            echo "── $test_file"
            psql -v ON_ERROR_STOP=1 -q -U budget_ci -d budget_ci -f "$test_file"
          done

      - name: Run backend API tests
        env:
          APP_ENV: development
          APP_HOST: 127.0.0.1
          APP_PORT: 8000
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_SCHEMA: budgeting
          POSTGRES_PASSWORD: budget_ci
          TELEGRAM_BOT_TOKEN: ci-test-bot-token
          SIGNUP_INVITE_CODE: ci-test-invite-code
        run: python -m backend.tests.test_auth_api

      - name: Validate docker compose
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: docker compose -f infra/docker-compose.yml config

  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Execute remote deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            REPO_SSH_URL="${{ secrets.REPO_SSH_URL }}"
            DEPLOY_BRANCH="${{ github.ref_name }}"

            if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
              echo "DEPLOY_PATH is not configured safely"
              exit 1
            fi

            if [ -z "$REPO_SSH_URL" ]; then
              echo "REPO_SSH_URL is not configured"
              exit 1
            fi

            mkdir -p "$(dirname "$DEPLOY_PATH")"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              rm -rf "$DEPLOY_PATH"
              git clone "$REPO_SSH_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            printf '%s\n' "APP_ENV=production" "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" "DB_DATABASE=${{ secrets.DB_DATABASE }}" "DB_SCHEMA=${{ secrets.DB_SCHEMA }}" "APP_HOST=0.0.0.0" "APP_PORT=8000" "FRONTEND_ORIGINS=${{ secrets.FRONTEND_ORIGINS }}" "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" "TELEGRAM_INIT_DATA_TTL_SECONDS=${{ secrets.TELEGRAM_INIT_DATA_TTL_SECONDS || '10800' }}" "CREDENTIALS_ENCRYPTION_KEY=${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}" "SESSION_TTL_SECONDS=${{ secrets.SESSION_TTL_SECONDS || '7776000' }}" "SIGNUP_INVITE_CODE=${{ secrets.SIGNUP_INVITE_CODE }}" "DB_HOST=db" "DB_PORT=5432" "MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}" "MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}" "MINIO_PREFIX=${{ secrets.MINIO_PREFIX }}" "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" "BACKUP_RETENTION=14" "LOCAL_S3_ENDPOINT=${{ secrets.LOCAL_S3_ENDPOINT }}" "LOCAL_S3_BUCKET=${{ secrets.LOCAL_S3_BUCKET }}" "LOCAL_S3_PREFIX=${{ secrets.LOCAL_S3_PREFIX || 'budget-bot' }}" "LOCAL_S3_ACCESS_KEY=${{ secrets.LOCAL_S3_ACCESS_KEY }}" "LOCAL_S3_SECRET_KEY=${{ secrets.LOCAL_S3_SECRET_KEY }}" "LOCAL_BACKUP_RETENTION=48" > infra/.env
            chmod 600 infra/.env

            COMPOSE="docker compose -f infra/docker-compose.yml --env-file infra/.env"

            # Сначала только БД: миграции должны примениться до того, как новый
            # API начнёт обслуживать запросы. Иначе между стартом контейнера и
            # накатом схемы живёт окно, в котором свежий код ходит в старые
            # функции.
            $COMPOSE up -d --build db

            echo "Ожидаю готовности БД..."
            for _ in $(seq 1 60); do
              if $COMPOSE exec -T db sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            $COMPOSE exec -T db sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

            # Дамп прямо перед миграциями. Регулярные бэкапы почасовые, а
            # неудачная миграция финансового реестра — это ровно тот случай,
            # когда откатываться нужно на минуту назад, а не на час. Локальный
            # файл, без зависимости от доступности MinIO.
            mkdir -p "$DEPLOY_PATH/pre-migrate-dumps"
            chmod 700 "$DEPLOY_PATH/pre-migrate-dumps"
            DUMP_FILE="$DEPLOY_PATH/pre-migrate-dumps/$(date -u +%Y%m%dT%H%M%SZ).dump"
            $COMPOSE exec -T db sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$DUMP_FILE"
            chmod 600 "$DUMP_FILE"
            echo "Дамп перед миграциями: $DUMP_FILE ($(du -h "$DUMP_FILE" | cut -f1))"
            ls -1t "$DEPLOY_PATH/pre-migrate-dumps"/*.dump | tail -n +6 | xargs -r rm -f

            # Накат недостающих миграций и пересоздание SQL-функций.
            # Идемпотентно: если менять было нечего, шаг ничего не делает.
            $COMPOSE exec -T db sh -lc 'export DB_DATABASE="$POSTGRES_DB"; bash /Scripts/run_migrations.sh'

            $COMPOSE up -d --build --remove-orphans
            docker image prune -f

            chmod +x scripts/backup-to-minio.sh

            # Два контура. local - наш MinIO, почасово: дёшево хранить и быстро
            # восстанавливаться. remote - Selectel, раз в сутки: это offsite-копия,
            # и только она переживает потерю сервера, на котором стоит MinIO.
            #
            # Расписания разведены (:15 и 03:40), хотя замки в скрипте и так свои
            # на каждый контур - просто чтобы два pg_dump не толкались.
            #
            # Маркеры в конце строк - якоря идемпотентности. В список удаляемых
            # входит и старый budget-bot-minio-backup: иначе прежняя строка
            # осталась бы и продолжала гонять remote ежечасно.
            LOCAL_CRON="15 * * * * cd $DEPLOY_PATH && ./scripts/backup-to-minio.sh local >> $DEPLOY_PATH/backup-to-minio.log 2>&1 # budget-bot-backup-local"
            REMOTE_CRON="40 3 * * * cd $DEPLOY_PATH && ./scripts/backup-to-minio.sh remote >> $DEPLOY_PATH/backup-to-minio.log 2>&1 # budget-bot-backup-remote"
            (crontab -l 2>/dev/null | grep -vE '# budget-bot-(minio-backup|backup-local|backup-remote)' || true; echo "$LOCAL_CRON"; echo "$REMOTE_CRON") | crontab -
